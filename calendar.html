<!DOCTYPE html>
<html>
<head>
  <title>Workout Calendar</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet"/>
  <style>
    #calendar { 
      max-width: 100%; 
      margin: 10px; 
      height: 650px;
      overflow: hidden;
    }
    .fc-daygrid-day-number { color: #333; }
    .fc-event { 
      background-color: #32CD32; 
      border: none; 
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      margin: 2px auto; 
      font-size: 0; 
    }
    .fc-scroller { overflow: hidden !important; }
  </style>
</head>
<body>
  <div id="calendar"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.8/index.global.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar');
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        initialDate: '2025-04-01',
        events: function(fetchInfo, successCallback) {
          fetch('https://api.airtable.com/v0/appJrEwyeKC1LzLef/tblgCWWfkUgWGGCqc', {
            headers: {
              Authorization: 'Bearer patScXq9p6ctg8kJp.b2fabeb93fafa4b5445608e50c2e2ca6cd3f80bb1025191d271fb7f6a98605f6'
            }
          })
            .then(response => response.json())
            .then(data => {
              var events = data.records.map(item => ({
                title: item.fields['Workout Name'],
                start: item.fields['Workout Date'],
                end: item.fields['Workout Date']
              }));
              successCallback(events);
            })
            .catch(error => console.error('Airtable error:', error));
        },
        eventClick: function(info) {
          window.location.href = 'https://app.adalo.com/a259d664-ba71-4d09-a51d-63847c163b87/screens/day-workouts?date=' + info.event.startStr;
        }
      });
      calendar.render();
    });
  </script>
</body>
</html>
