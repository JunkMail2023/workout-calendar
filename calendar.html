<!DOCTYPE html>
<html>
<head>
  <title>Workout Calendar</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet"/>
  <style>
    #calendar { 
      max-width: 100%; 
      margin: 10px; 
      height: 650px; /* Fixed height for ~5 weeks */
      overflow: hidden; /* No scrollbar */
    }
    .fc-daygrid-day-number { color: #333; }
    .fc-event { background-color: #FFD700; border-color: #DAA520; }
    .fc-scroller { overflow: hidden !important; } /* Force no scroll */
  </style>
</head>
<body>
  <div id="calendar"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.8/index.global.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar');
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        initialDate: '2025-04-01',
        events: [], // Static for now
        eventClick: function(info) {
          window.location.href = '/day-workouts?date=' + info.event.startStr;
        }
      });
      calendar.render();
    });
  </script>
</body>
</html>
